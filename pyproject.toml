[tool.poetry]
name = "compose-to-quadlet"
version = "0.1.0"
description = "Convert Docker/Podman Compose YAML into Podman Quadlet (.container/.service/.network/.volume) files."
authors = ["The 17711 Frame <contact@17711.org>"]
license = "MIT"
readme = "README.md"
homepage = "https://17711.org"
repository = "https://github.com/17711/compose-to-quadlet"
keywords = ["podman", "quadlet", "compose", "docker", "kubernetes", "converter"]
packages = [{ include = "compose_to_quadlet", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
click = "^8.1.7"
pydantic = "^2.9.2"
pyyaml = "^6.0.2"
anyio = "^4.4.0"
aiofiles = "^24.1.0"
typing-extensions = "^4.12.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0" # Added pytest-cov
mypy = "^1.11.2"
ruff = "^0.6.9"
black = "^24.10.0"
coverage = "^7.6.1"
coverage-badge = "^1.1.0"
pre-commit = "^4.0.1"
pdoc = "^15.0.0"

[tool.poetry.scripts]
compose-to-quadlet = "compose_to_quadlet.cli:main"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
extend-select = ["I"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --cov=src/compose_to_quadlet --cov-report=term-missing" # Updated addopts
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["src/compose_to_quadlet"]

[tool.coverage.report]
show_missing = true
